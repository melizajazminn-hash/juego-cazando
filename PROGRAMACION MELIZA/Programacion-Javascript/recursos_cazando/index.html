<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Cazando - Edición Pro</title>
  <link rel="stylesheet" href="cazando.css">
</head>
<body>
<!-- Busca tu etiqueta body y cámbiala para que quede así -->
<body onload="iniciarJuego()">

  <h1>Juego Cazando</h1>
  <p id="mensaje">Autor: MLxz</p>

  <div style="text-align: center;">
    <canvas id="juego" width="500" height="350"></canvas>
  </div>

  <div class="panel">
    <div class="stat-box">Puntos: <span id="puntos">0</span></div>
    <div class="stat-box">Tiempo: <span id="tiempo">10</span></div>
  </div>

  <div class="controls">
    <button id="arriba" class="btn-control">↑</button>
    <div class="row">
      <button id="izquierda" class="btn-control">←</button>
      <button id="abajo" class="btn-control">↓</button>
      <button id="derecha" class="btn-control">→</button>
    </div>
  </div>

  <div style="text-align: center;">
    <button id="btn-reiniciar" class="boton-reiniciar">NEW</button>
  </div>

  <script src="cazando.js"></script>
</body>
